# ---------------------------------------------------------------------------
# EKF configuration.  RULES:
#   * Every number that is a decimal MUST contain a ".", e.g. 1.0 not 1
#     (ROS 2 treats 1 and 1.0 as different types and will refuse to start).
#   * The top-level key must equal the node name.
# ---------------------------------------------------------------------------
ekf_localization_node:
  ros__parameters:
    # ---- frames / outputs -------------------------------------------------
    odom_frame: odom
    base_link_frame: base_link
    publish_tf: true              # we OWN odom->base_link. Set rf2o publish_tf:=false!
    output_rate_hz: 30.0          # rate of /odometry/filtered and TF
    diagnostics_rate_hz: 1.0
    max_extrapolation_s: 0.2      # never predict the output further than this past the newest data
    max_future_stamp_s: 0.1       # message stamps further in the future than this are replaced by receive time
    history_window_s: 2.0         # how far back late measurements may still be inserted (must exceed worst sensor latency)

    # ---- outlier gate recovery -------------------------------------------
    gate:
      max_consecutive_rejects: 20   # after this many rejections in a row from one sensor ...
      recovery_inflation: 25.0      # ... let one through with its noise multiplied by this

    # ---- filter tuning (see guide chapter "Tuning with NIS") ---------------
    filter:
      q_pos: 1.0e-6          # m^2/s      unmodelled pose drift
      q_yaw: 1.0e-6          # rad^2/s
      q_vel: 0.1             # (m/s)^2/s  how quickly vx,vy may change   (~ accel_sigma^2)
      q_wz: 1.0              # (rad/s)^2/s how quickly yaw-rate may change
      q_bias: 1.0e-8         # (rad/s)^2/s gyro bias random walk
      p0_pos: 1.0e-6
      p0_yaw: 1.0e-6
      p0_vel: 0.1
      p0_wz: 0.1
      p0_bias: 4.0e-4
      max_predict_dt: 0.5    # s   total sensor silence longer than this => robot assumed stopped
