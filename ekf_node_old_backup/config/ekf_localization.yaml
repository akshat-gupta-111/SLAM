      dropout_vel_std: 0.3   # m/s   uncertainty re-injected when velocity is lost
      dropout_wz_std: 0.5    # rad/s

    # ---- Sensor 1: IMU gyro (MPU6050) --------------------------------------
    # Only gyro-z is fused. Orientation is integrated gyro (no magnetometer),
    # so fusing it too would count the same information twice.
    imu:
      enabled: true
      topic: /imu/data
      calibration_file: ''          # filled by the launch file
      fallback_gyro_variance: 8.7e-7
      noise_scale: 10.0             # calibration was taken at rest; real noise is higher
      gate_chi2: 10.83              # 99.9 % for 1 degree of freedom
      stale_timeout_s: 0.2

    # ---- Sensor 2: 2D LiDAR odometry (rf2o) --------------------------------
    rf2o:
      enabled: true
      topic: /odom_rf2o_corrected
      calibration_file: ''          # filled by the launch file
      fallback_variance: [4.9e-6, 3.1e-6, 2.4e-5]   # vx, vy, wz
      noise_scale: 25.0             # variance multiplier: stationary calibration under-states in-motion error
      use_message_covariance: false
      max_message_variance: 1000.0
      gate_chi2: 16.27              # 99.9 % for 3 degrees of freedom
      stale_timeout_s: 0.5

    # ---- Sensor 3: Visual odometry ------------------------------------------
    # PLACEHOLDER NUMBERS - measure yours (guide chapter "Calibrating VO noise").
    visual_odom:
      enabled: false
      topic: /visual_odom           # <-- CHANGE to your VO topic
      noise_std: [0.05, 0.05, 0.05] # std of vx [m/s], vy [m/s], wz [rad/s]
      use_message_covariance: false
      max_message_variance: 1000.0
      gate_chi2: 16.27
      stale_timeout_s: 0.5
