mapper_utility:
  ros__parameters:
    odom_topic: "/odometry/filtered"
    scan_topic: "/scan"
    map_topic: "/map"
    map_frame: "map"
    odom_frame: "odom"
    base_frame: "base_link"
    resolution: 0.05          # 5 cm per pixel
    width_meters: 20.0        # 20m x 20m room coverage
    height_meters: 20.0
    auto_start_mapping: true  # Start mapping immediately or toggle via service
    map_save_dir: "~/Desktop/SLAM/slam_node/maps"
    default_map_name: "room_map"

nav_utility:
  ros__parameters:
    odom_topic: "/odometry/filtered"
    scan_topic: "/scan"
    map_topic: "/map"
    nav_topic: "/nav"
    cmd_vel_topic: "/cmd_vel"
    map_save_dir: "~/Desktop/SLAM/slam_node/maps"
    default_map_name: "room_map"
    max_linear_speed: 0.35
    max_angular_speed: 0.8
    goal_tolerance: 0.20
    obstacle_stop_distance: 0.35
