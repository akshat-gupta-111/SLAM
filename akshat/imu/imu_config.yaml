# ==============================================================================
# Industrial IMU Configuration Profile (MPU6050)
# Generated: 2026-10-30
# Platform: NVIDIA Jetson Orin Nano / Linux IIO High-Speed Interface
# Description: Sensor profile containing factory scale variables, static biases, 
#              experimentally determined noise metrics, and spatial kinematics.
# ==============================================================================

imu_metadata:
  sensor_model: "MPU6050"
  interface: "I2C / Linux c250000.i2c / Bus 7"
  default_address: "0x68"
  expected_sampling_rate_hz: 180.0

# Kinematic Rigid Body Transformation (TF) Relative to Robot Base Link Origin
# Used to eliminate lever-arm effects: a_true = a_imu - alpha x r - w x (w x r)
spatial_extrinsics:
  frame_id: "imu_link"
  parent_frame_id: "base_link"
  translation_meters:
    x: 0.00
    y: 0.00
    z: 0.15                         # 15 cm vertical Z-axis lever-arm offset
  rotation_euler_degrees:
    roll: 0.0
    pitch: 0.0
    yaw: 0.0

# Scale Factors to convert raw 16-bit signed integers to SI physical units
scale_factors:
  accelerometer:
    setting: "+/- 2g"
    multiplier: 16384.0          # LSB per g (divide raw value by this)
    target_gravity_mps2: 9.80665 # Earth normal gravity vector scale
  gyroscope:
    setting: "+/- 250 deg/s"
    multiplier: 131.0            # LSB per deg/s (divide raw value by this)

# Static Hardware Biases (Offsets calculated during stationary window)
# Subtract these values from your raw converted readings to centre data at 0.00
static_calibration_offsets:
  accelerometer_bias:
    ax: -0.3710150660644529      # m/s²
    ay: 0.08687600144042967      # m/s²
    az: 0.21896410703125468      # m/s² (Bias relative to perfect 1g frame)
  gyroscope_bias:
    gx: -9.91088549618321        # °/s
    gy: -0.32137404580152634     # °/s
    gz: 1.781374045801527        # °/s

# Statistical Characterization of Additive White Gaussian Noise (AWGN)
# Map these values directly to your Kalman Filter Covariance Matrices (R and Q)
noise_characterization:
  accelerometer_variance:        # Covariance Matrix 'R' Diagonal [m/s²]^2
    x: 0.004777
    y: 0.001765
    z: 0.002336
  gyroscope_variance:            # Covariance Matrix 'Q' Diagonal [°/s]^2
    x: 0.030357
    y: 0.025143
    z: 0.050617

# Verification Reference Metrics
# Ground truth sanity bounds observed while the sensor was stationary
expected_stationary_bounds:
  accel_limits_mps2:
    x_range: [-0.12, 0.10]
    y_range: [-0.08, 0.11]
    z_range: [9.68, 9.95]       # Centred exactly around 1g (~9.81 m/s²)
  gyro_limits_degs:
    x_range: [-0.4, 0.3]
    y_range: [-0.3, 0.3]
    z_range: [-0.6, 0.4]
